replicaCount: 3

image:
  repository: user-management-api
  tag: "1.0.8"
  pullPolicy: IfNotPresent

namespace:
  name: development

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080

env:
  springProfilesActive: "default"
  javaToolOptions: "-XX:MaxRAMPercentage=75.0 -Djava.awt.headless=true"

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

probes:
  readiness:
    path: /actuator/health
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    path: /actuator/health
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 3
