apiVersion: v1
kind: Service
metadata:
  name: user-management-api-service
  namespace: development
  labels:
    app: user-management-api
    environment: development
spec:
  type: NodePort
  selector:
    app: user-management-api
  ports:
    - name: http
      protocol: TCP
      port: 80           # Internal cluster port
      targetPort: 8080   # Container port
      nodePort: 30080    # External port (accessible on localhost:8080 via Docker Desktop)
